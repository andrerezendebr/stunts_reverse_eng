[package]
name = "stunts-rs"
version = "0.1.0"
edition = "2021"
default-run = "stunts-rs"
description = "DOS resource analysis and verified simulation kernels for Stunts"

[dependencies]
minifb = { version = "0.29.0", optional = true }
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"], optional = true }
glam = { version = "0.30", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
wgpu = { version = "27.0.1", default-features = false, features = ["std", "wgsl", "vulkan", "dx12", "gles"], optional = true }

[features]
desktop = ["dep:minifb"]
modern = ["dep:eframe", "dep:glam", "dep:bytemuck", "dep:wgpu"]

[[bin]]
name = "stunts-play"
path = "src/bin/stunts-play.rs"
required-features = ["desktop"]

[[bin]]
name = "stunts-modern"
path = "src/bin/stunts-modern.rs"
required-features = ["modern"]
